[toolchain]
anchor_version = "0.32.1"
solana_version = "3.1.10"
package_manager = "npm"

[features]
resolution = true
skip-lint = true


[programs.devnet]
fun100x = "CYzM71ENGdE6Gjx5NWt4r12EbhGX2DnoEua5oWh8xpCz"

[programs.localnet]
fun100x = "CYzM71ENGdE6Gjx5NWt4r12EbhGX2DnoEua5oWh8xpCz"

[registry]
url = "https://api.apr.dev"


[provider]
cluster = "localnet"
wallet = "~/.config/solana/id.json"

[scripts]
test = "npx mocha -t 1000000 'tests/**/*.js'"

[test]
startup_wait = 60000

[test.validator]
bind_address = "127.0.0.1"
rpc_port = 8899
